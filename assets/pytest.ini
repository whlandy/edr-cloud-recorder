[pytest]
# 默认只收 tests/ 里整理过的用例。录制草稿放在 recordings/，不进默认收集 ——
# 草稿按定义是半成品，可能引用还没写的 helper，里面还常有未经审阅的真实写操作；
# 它不该被一句 `pytest` 顺带跑掉，尤其是在你以为自己只是在跑回归测试的时候。
#
# 但草稿必须能显式跑，那是录完之后第一件想做的事：
#     pytest recordings/test_xxx.py
# 显式路径参数会覆盖 testpaths，所以这条天然成立 —— 不需要额外的开关。
# （JS 版为此要一个 REC_DRAFTS 环境变量配合 testDir/testMatch，pytest 免了。）
testpaths = tests

# 对应 playwright.config.ts 里 use.trace / video / screenshot 那三项。
# 失败时保留现场，比读日志快得多。
# --reruns 对应 config 的 retries：服务端在短时间内收到大量请求时可能返回 5xx，
# 重试即恢复；不重试会产生大量假失败，掩盖真问题。CI 上建议调到 2。
# 不配并行 —— 界面操作往往共享全局状态，pytest 默认串行正是想要的行为。
addopts =
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --output=test-results
    --reruns=1
    --timeout=120

# 让中文用例名在 -v 输出里原样显示，而不是被转义成 \u...
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
